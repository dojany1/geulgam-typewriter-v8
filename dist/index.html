<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="무작위로 뽑힌 두 명사를 모두 넣어 짧은 글을 쓰는 제시어 글쓰기 사이트, 글감.">
  <title>GULGAM · 제시어 글쓰기</title>
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ko_KR">
  <meta property="og:site_name" content="글감">

  <meta property="og:description" content="무작위로 뽑힌 두 단어를 모두 넣어 짧은 글을 쓰고, 영수증으로 뽑아 친구에게 같은 글감을 보내요.">
  <meta property="og:image" content="https://gulgam.dokhustudio.com/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="글감 영수증. 두 단어 연필과 치킨, 그리고 짧은 글.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="글감 · 두 단어로 짧은 글 한 편">
  <meta name="twitter:description" content="무작위로 뽑힌 두 단어를 모두 넣어 짧은 글을 쓰고, 영수증으로 뽑아 친구에게 같은 글감을 보내요.">
  <meta name="twitter:image" content="https://gulgam.dokhustudio.com/assets/og.png">
  <link rel="icon" href="assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="common.css?v=8">
  <link rel="stylesheet" href="styles.css?v=7">
  <script src="words.js?v=6" defer></script>
  <script src="app.js?v=15" defer></script>
</head>
<body data-view="write" data-edition="original">
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="vol" viewBox="0 0 24 24"><path d="m11.8 4-6 4.8H2.5v6.4h3.3l6 4.8Z" fill="currentColor" stroke="none"/><path d="M15.1 8.5a4.6 4.6 0 0 1 0 7m3-10a8.8 8.8 0 0 1 0 13"/></symbol>
    <symbol id="quiet" viewBox="0 0 24 24"><path d="m11.8 4-6 4.8H2.5v6.4h3.3l6 4.8Z" fill="currentColor" stroke="none"/><path d="m15.5 9 6 6m0-6-6 6"/></symbol>
    <symbol id="gear" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M10 1h4l.7 3 1.7.8L19 3.3l2.7 2.8-1.5 2.6.8 1.7 3 .7v3.6l-3 .7-.8 1.7 1.5 2.6-2.8 2.7-2.6-1.5-1.7.8-.7 2.7h-3.8l-.7-2.7-1.7-.8-2.6 1.5-2.8-2.7 1.5-2.6-.8-1.7-2.7-.7v-3.6l2.7-.7.8-1.7L2.1 6.1l2.8-2.8 2.6 1.5 1.7-.8L10 1Zm2 7.5a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Z"/></symbol>
    <symbol id="reset" viewBox="0 0 24 24"><path d="M8 6.5A7.5 7.5 0 1 1 5 13M9.3 2.8 6 6.5l3.9 2.8"/></symbol>
    <symbol id="next" viewBox="0 0 24 24"><path d="m9.2 5.4 6.5 6.6-6.5 6.6"/></symbol>
    <symbol id="copy-icon" viewBox="0 0 24 24"><path d="M8.5 7.5h12v14h-12zM16 3H4v14"/></symbol>
    <symbol id="download-icon" viewBox="0 0 24 24"><path d="M12 2.5v12.8m-5-5 5 5 5-5M3.5 17v4.3h17V17"/></symbol>
    <symbol id="print-icon" viewBox="0 0 24 24"><path d="M7 8V2.8h10V8M7 16H3.5V8h17v8H17M7 13h10v8H7zM16.5 10.5h1"/></symbol>
    <symbol id="close-icon" viewBox="0 0 24 24"><path d="m5 5 14 14m0-14L5 19"/></symbol>
    <symbol id="dots" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><circle cx="4.5" cy="12" r="2.1"/><circle cx="12" cy="12" r="2.1"/><circle cx="19.5" cy="12" r="2.1"/></g></symbol>
    <symbol id="tone" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path fill="currentColor" stroke="none" d="M12 3a9 9 0 0 1 0 18z"/></symbol>
    <symbol id="share-icon" viewBox="0 0 24 24"><path d="M12 3v12m-4.5-7.5L12 3l4.5 4.5M5 13v7.5h14V13"/></symbol>
    <symbol id="rule-icon" viewBox="0 0 24 24"><path d="M4 6.5h9m5 0h2M4 12h3m5 0h8M4 17.5h11m5 0h0"/><circle cx="15.5" cy="6.5" r="2"/><circle cx="9.5" cy="12" r="2"/><circle cx="17.5" cy="17.5" r="2"/></symbol>
  </svg>
  <aside class="edition-banner" data-edition-banner>
    <a href="typewriter/">타자기 버전에서 이어 써보세요! <span aria-hidden="true">↗</span></a>
    <button type="button" class="banner-close" data-dismiss-banner aria-label="배너 닫기"><svg><use href="#close-icon"/></svg></button>
  </aside>
  <header class="topnav column">
    <a class="logotype" href="./" aria-label="GULGAM 글쓰기 홈" lang="en">gul<strong>gam</strong></a>
    <nav class="nav-links" aria-label="주 메뉴">
      <button type="button" id="sound" aria-label="타건음" title="타건음" aria-pressed="false" class="icon sound-toggle"><svg class="sound-on"><use href="#vol"/></svg><svg class="sound-off"><use href="#quiet"/></svg></button>
      <button type="button" data-action="reroll" class="nav-reroll">글감 뽑기</button>
      <a href="typewriter/" class="edition-link">타자기 버전</a>
      <button type="button" data-open-settings class="nav-settings">설정</button>
      <button class="icon mode-button" type="button" data-theme-toggle aria-label="화면 테마 전환" title="화면 테마 전환"><svg><use href="#tone"/></svg></button>
    </nav>
  </header>
  <main class="column workspace">
    <div class="context-bar">
      <button type="button" data-open-pieces>뽑은 글</button>
      <button type="button" data-open-prompt>글감 설정 <svg><use href="#rule-icon"/></svg></button>
      <button type="button" data-open-settings>글쓰기 설정 <svg><use href="#gear"/></svg></button>
      <a href="typewriter/">타자기 버전 <span class="play-arrow" aria-hidden="true"></span></a>
    </div>
    <section id="write-view" aria-label="글쓰기">
      <div class="writing-area">
        <h1 id="words"><span data-prompt-word></span> · <span data-prompt-word></span></h1>
        <span id="prompt-progress" class="visually-hidden" role="status" aria-atomic="true"></span>
        <textarea id="editor" spellcheck="false" aria-label="나의 글" aria-describedby="words prompt-progress" placeholder="두 단어를 넣어 자유롭게 써보세요."></textarea>
      </div>
      <div class="finish-row"><button type="button" class="finish-button" data-finish data-ready="false" aria-disabled="true" aria-describedby="prompt-progress">두 단어 남음</button></div>
      <footer class="article-tools">
        <div class="pager">
          <button type="button" id="reroll" aria-label="글감 다시 뽑기" title="글감 다시 뽑기"><svg><use href="#reset"/></svg></button>
          <button type="button" data-action="pull" aria-label="글 뽑기" title="글 뽑기" disabled><svg><use href="#next"/></svg></button>
        </div>
        <div class="attribution">
          <strong data-prompt-title>오늘의 글감</strong><span class="prompt-line" data-prompt-line hidden></span>
          <div><span id="word-count">0자</span><i aria-hidden="true"></i><span id="save-status" role="status"></span></div>
        </div>
        <div class="tool-icons">
          <button type="button" class="icon" data-action="share-prompt" aria-label="같은 글감 보내기" title="같은 글감 보내기"><svg><use href="#share-icon"/></svg></button>
          <button type="button" class="icon" data-action="copy" aria-label="글 복사" title="글 복사"><svg><use href="#copy-icon"/></svg></button>
          <button type="button" class="icon" data-action="download" aria-label="TXT 저장" title="TXT 저장"><svg><use href="#download-icon"/></svg></button>
          <button type="button" class="icon" id="pull" aria-label="글 뽑기" title="글 뽑기" disabled><svg><use href="#print-icon"/></svg></button>
          <button type="button" class="icon" data-open-tools aria-label="글 도구 더 보기" title="글 도구 더 보기"><svg><use href="#dots"/></svg></button>
        </div>
      </footer>
    </section>
    <section id="receipt-view" hidden aria-label="글 영수증">
      <div class="result-area">
        <h1 id="receipt-focus" tabindex="-1">글 영수증</h1>
        <div class="result-meta"><span id="receipt-words"></span><span id="receipt-date"></span><span id="receipt-rule" hidden></span><span id="receipt-conditions" hidden></span></div>
        <div id="receipt-text"></div>
      </div>
      <footer class="result-tools">
        <button id="back" type="button">← 다시 쓰기</button><span id="receipt-length"></span><span id="receipt-kept" class="receipt-kept"></span>
        <div class="result-exports"><button type="button" data-action="share-card">글 가리고 공유</button><button type="button" data-action="share-image">영수증 이미지</button><button type="button" data-action="share-prompt">글감 보내기</button><button id="copy" type="button">글 복사</button><button id="download" type="button">TXT 저장</button></div>
      </footer>
    </section>
    <textarea readonly hidden aria-label="복사용 본문" id="copy-fallback"></textarea>
  </main>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <div class="dialog-heading"><h2 id="settings-title">글쓰기 설정</h2><button data-close-dialog aria-label="설정 닫기" type="button" class="icon"><svg><use href="#close-icon"/></svg></button></div>
    <div class="setting-row"><span>타건음</span><button type="button" data-sound-toggle aria-pressed="false"><span data-sound-label>소리 꺼짐</span></button></div>
    <div class="setting-row"><span>화면 테마</span><div class="setting-buttons"><button type="button" data-theme-toggle><span data-theme-label>테마 전환</span></button><button type="button" data-theme-auto>기기 설정</button></div></div>
  </dialog>
  <dialog id="tools-dialog" aria-labelledby="tools-title">
    <div class="dialog-heading"><h2 id="tools-title">글 도구</h2><button data-close-dialog aria-label="도구 닫기" type="button" class="icon"><svg><use href="#close-icon"/></svg></button></div>
    <div class="tools-list"><button type="button" data-action="pull" disabled>글 뽑기</button><button type="button" data-open-pieces>뽑은 글</button><button type="button" data-action="share-prompt">글감 보내기</button><button type="button" data-action="copy">글 복사</button><button type="button" data-action="download">TXT 저장</button></div>
  </dialog>
  <dialog id="pieces-dialog" aria-labelledby="pieces-title">
    <div class="dialog-heading"><h2 id="pieces-title">뽑은 글</h2><button data-close-dialog aria-label="뽑은 글 닫기" type="button" class="icon"><svg><use href="#close-icon"/></svg></button></div>
    <p class="pieces-note">이 브라우저에만 남아요. 브라우저 데이터를 지우면 사라져요.</p>
    <ul id="pieces-list" class="pieces-list"></ul>
    <p id="pieces-empty" class="pieces-empty" hidden>아직 뽑은 글이 없어요. 글을 뽑으면 여기에 쌓여요.</p>
    <div class="pieces-footer"><span id="pieces-count"></span><button type="button" data-export-pieces disabled>전부 TXT로 저장</button></div>
  </dialog>
  <dialog id="prompt-dialog" aria-labelledby="prompt-title">
    <div class="dialog-heading"><h2 id="prompt-title">글감 설정</h2><button data-close-dialog aria-label="글감 설정 닫기" type="button" class="icon"><svg><use href="#close-icon"/></svg></button></div>
    <div class="setting-row"><label for="prompt-kind">글감 <small>형용사는 모양을 바꿔 써도 돼요</small></label><select id="prompt-kind" data-prompt-kind><option value="daily">오늘의 글감</option><option value="noun">명사 + 명사</option><option value="adjective">형용사 + 명사</option></select></div>
    <div class="setting-row"><label for="prompt-rule">제약 <small>앱이 확인하고 글 뽑기를 막아요</small></label><select id="prompt-rule" data-prompt-rule><option value="">없음</option></select></div>
    <div class="prompt-value" data-prompt-value hidden><span data-rule-value></span><button type="button" data-redraw-rule>다른 값 뽑기</button></div>
    <div class="setting-row"><label for="prompt-pov">시점</label><select id="prompt-pov" data-prompt-condition="pov"><option value="">없음</option></select></div>
    <div class="setting-row"><label for="prompt-mood">분위기</label><select id="prompt-mood" data-prompt-condition="mood"><option value="">없음</option></select></div>
    <div class="setting-row"><label for="prompt-form">묘사 방식</label><select id="prompt-form" data-prompt-condition="form"><option value="">없음</option></select></div>
    <p class="prompt-note">시점·분위기·묘사 방식은 영수증에 적히기만 해요. 지켰는지는 읽는 사람이 봐요.</p>
  </dialog>
  <div role="status" id="toast" hidden></div>
</body>
</html>
