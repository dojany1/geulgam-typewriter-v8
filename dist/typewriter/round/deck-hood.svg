<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 124" preserveAspectRatio="none" fill="none">
  <style>
    :root { --plate: #e5e5e5; --paper: #fafafa; --ink: #303030; --rule: #858585; }
    @media (prefers-color-scheme: dark) {
      :root { --plate: #303030; --paper: #232323; --ink: #dedede; --rule: #797979; }
    }
  </style>
  <defs>
    <clipPath id="basket">
