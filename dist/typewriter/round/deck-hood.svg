  <g clip-path="url(#basket)">
    <path d="M201 0H519V98H201Z" fill="var(--paper)"/>
    <g transform="translate(360 -34) scale(1 .82)">
      <use href="#lever" transform="rotate(-72)"/>
      <use href="#lever" transform="rotate(-68)"/>
      <use href="#lever" transform="rotate(-64)"/>
      <use href="#lever" transform="rotate(-60)"/>
      <use href="#lever" transform="rotate(-56)"/>
      <use href="#lever" transform="rotate(-52)"/>
