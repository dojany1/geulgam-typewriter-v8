      <use href="#lever" transform="rotate(-44)"/>
      <use href="#lever" transform="rotate(-40)"/>
      <use href="#lever" transform="rotate(-36)"/>
      <use href="#lever" transform="rotate(-32)"/>
      <use href="#lever" transform="rotate(-28)"/>
      <use href="#lever" transform="rotate(-24)"/>
      <use href="#lever" transform="rotate(-20)"/>
      <use href="#lever" transform="rotate(-16)"/>
      <use href="#lever" transform="rotate(-12)"/>
      <use href="#lever" transform="rotate(-8)"/>
      <use href="#lever" transform="rotate(-4)"/>
      <use href="#lever" transform="rotate(0)"/>
      <use href="#lever" transform="rotate(4)"/>
      <use href="#lever" transform="rotate(8)"/>
      <use href="#lever" transform="rotate(12)"/>
      <use href="#lever" transform="rotate(16)"/>
      <use href="#lever" transform="rotate(20)"/>
      <use href="#lever" transform="rotate(24)"/>
