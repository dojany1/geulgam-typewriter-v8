<html lang="ko">

  <meta name="twitter:title" content="글감 타자기 · 두 단어로 짧은 글 한 편">
  <meta name="twitter:description" content="무작위로 뽑힌 두 단어를 모두 넣어 타자기로 짧은 글을 쓰고, 영수증으로 뽑아 친구에게 같은 글감을 보내요.">

  <link rel="stylesheet" href="../styles.css?v=5">
  <link rel="stylesheet" href="edition.css?v=4">
  <link rel="stylesheet" href="modes.css?v=6">
  <script defer src="../words.js?v=6"></script>
  <script defer src="../app.js?v=10"></script>
  <script defer src="strike.js"></script>
  <script defer src="typesetter.js"></script>
</head>
<body data-edition="typewriter" data-view="write">
  <svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="g-theme" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="g-sound" viewBox="0 0 24 24"><path d="m11.8 4-6 4.8H2.5v6.4h3.3l6 4.8Z" fill="currentColor" stroke="none"/><path d="M15.1 8.5a4.6 4.6 0 0 1 0 7m3-10a8.8 8.8 0 0 1 0 13"/></symbol>
    <symbol id="g-mute" viewBox="0 0 24 24"><path d="m11.8 4-6 4.8H2.5v6.4h3.3l6 4.8Z" fill="currentColor" stroke="none"/><path d="m15.5 9 6 6m0-6-6 6"/></symbol>
    <symbol id="g-roll" viewBox="0 0 24 24"><path d="M8 6.5A7.5 7.5 0 1 1 5 13M9.3 2.8 6 6.5l3.9 2.8"/></symbol>
    <symbol id="g-enter" viewBox="0 0 24 24"><path d="M19 5v9H5m5-5-5 5 5 5"/></symbol>
    <symbol id="g-back" viewBox="0 0 24 24"><path d="M20 12H4m6-6-6 6 6 6"/></symbol>
    <symbol id="close-icon" viewBox="0 0 24 24"><path d="m5 5 14 14m0-14L5 19"/></symbol>
    <symbol id="share-icon" viewBox="0 0 24 24"><path d="M12 3v12m-4.5-7.5L12 3l4.5 4.5M5 13v7.5h14V13"/></symbol>
    <symbol id="rule-icon" viewBox="0 0 24 24"><path d="M4 6.5h9m5 0h2M4 12h3m5 0h8M4 17.5h11m5 0h0"/><circle cx="15.5" cy="6.5" r="2"/><circle cx="9.5" cy="12" r="2"/><circle cx="17.5" cy="17.5" r="2"/></symbol>
  </svg>
  <header class="topnav column">
    <a href="../" class="logotype" aria-label="GULGAM 기본 모드로" lang="en">gul<strong>gam</strong></a>
    <nav class="nav-links" aria-label="타자기 메뉴">
      <button type="button" id="sound" class="icon sound-toggle" aria-label="타건음" title="타건음" aria-pressed="true"><svg class="sound-on" aria-hidden="true"><use href="#g-sound"/></svg><svg class="sound-off" aria-hidden="true"><use href="#g-mute"/></svg></button>
      <a href="../">기본 모드</a>
      <span class="typewriter-modes" role="group" aria-label="타자기 선택">
        <span class="current-mode" aria-current="page">사각 글쇠</span>
        <span aria-hidden="true">/</span>
        <a href="round/">원형 글쇠</a>
      </span>
      <button type="button" data-theme-toggle class="icon mode-button" title="화면 테마 전환" aria-label="화면 테마 전환"><svg aria-hidden="true"><use href="#g-theme"/></svg></button>
    </nav>
  </header>

  <main class="column workspace console">
    <section id="write-view" data-typesetter aria-label="타자기로 글쓰기">
      <header class="context-bar">
        <div class="prompt"><span class="prompt-label">오늘의 글감</span><span class="prompt-line" data-prompt-line hidden></span></div>
        <div class="prompt-actions">
          <button type="button" data-open-prompt aria-label="글감 설정" title="글감 설정"><svg aria-hidden="true"><use href="#rule-icon"/></svg><span>글감 설정</span></button>
          <button type="button" data-action="share-prompt" aria-label="같은 글감 보내기" title="같은 글감 보내기"><svg aria-hidden="true"><use href="#share-icon"/></svg><span>글감 보내기</span></button>
          <button id="reroll" type="button" aria-label="글감 다시 뽑기" title="글감 다시 뽑기"><svg aria-hidden="true"><use href="#g-roll"/></svg><span>다른 글감</span></button>
        </div>
      </header>
      <div class="writing-area">
        <h1 id="words"><span data-prompt-word></span> · <span data-prompt-word></span></h1>
        <span id="prompt-progress" class="visually-hidden" role="status" aria-atomic="true"></span>
        <textarea id="editor" rows="3" spellcheck="false" aria-label="나의 글" aria-describedby="words prompt-progress editor-shortcuts" enterkeyhint="send" placeholder="두 단어를 넣어 자유롭게 써보세요."></textarea>
      </div>
      <div class="carriage">
        <div class="type-window" data-type-window aria-hidden="true">
          <div class="type-belt" data-type-belt></div>
          <div class="type-head" data-type-head></div>
        </div>
        <div class="carriage-controls">
          <button type="button" class="return-handle" data-return-handle aria-label="왼쪽으로 당기거나 눌러 줄바꿈" title="왼쪽으로 당기거나 눌러 줄바꿈">
            <span class="return-track" aria-hidden="true"><span class="return-grip"></span></span>
            <span>당겨서 줄바꿈</span>
          </button>
          <div class="type-position"><span><b data-type-line>01</b> 행</span><span><b data-type-column>01</b> 칸</span></div>
        </div>
      </div>

      <div class="keyboard" data-ui-keyboard data-layout="ko" data-shift="off" role="group" aria-label="화면 자판">
        <div class="key-row">
          <button type="button" data-code="KeyQ" aria-label="ㅂ (Q)"><span data-key-primary>ㅂ</span><span data-key-secondary>Q</span></button>
          <button type="button" data-code="KeyW" aria-label="ㅈ (W)"><span data-key-primary>ㅈ</span><span data-key-secondary>W</span></button>
          <button type="button" data-code="KeyE" aria-label="ㄷ (E)"><span data-key-primary>ㄷ</span><span data-key-secondary>E</span></button>
          <button type="button" data-code="KeyR" aria-label="ㄱ (R)"><span data-key-primary>ㄱ</span><span data-key-secondary>R</span></button>
          <button type="button" data-code="KeyT" aria-label="ㅅ (T)"><span data-key-primary>ㅅ</span><span data-key-secondary>T</span></button>
          <button type="button" data-code="KeyY" aria-label="ㅛ (Y)"><span data-key-primary>ㅛ</span><span data-key-secondary>Y</span></button>
          <button type="button" data-code="KeyU" aria-label="ㅕ (U)"><span data-key-primary>ㅕ</span><span data-key-secondary>U</span></button>
          <button type="button" data-code="KeyI" aria-label="ㅑ (I)"><span data-key-primary>ㅑ</span><span data-key-secondary>I</span></button>
          <button type="button" data-code="KeyO" aria-label="ㅐ (O)"><span data-key-primary>ㅐ</span><span data-key-secondary>O</span></button>
          <button type="button" data-code="KeyP" aria-label="ㅔ (P)"><span data-key-primary>ㅔ</span><span data-key-secondary>P</span></button>
          <button type="button" class="function-key" data-code="Backspace" aria-label="지우기"><span aria-hidden="true" class="key-symbol">⌫</span><span class="key-name">지우기</span></button>
        </div>
        <div class="key-row">
          <button type="button" data-code="KeyA" aria-label="ㅁ (A)"><span data-key-primary>ㅁ</span><span data-key-secondary>A</span></button>
          <button type="button" data-code="KeyS" aria-label="ㄴ (S)"><span data-key-primary>ㄴ</span><span data-key-secondary>S</span></button>
          <button type="button" data-code="KeyD" aria-label="ㅇ (D)"><span data-key-primary>ㅇ</span><span data-key-secondary>D</span></button>
          <button type="button" data-code="KeyF" aria-label="ㄹ (F)"><span data-key-primary>ㄹ</span><span data-key-secondary>F</span></button>
          <button type="button" data-code="KeyG" aria-label="ㅎ (G)"><span data-key-primary>ㅎ</span><span data-key-secondary>G</span></button>
          <button type="button" data-code="KeyH" aria-label="ㅗ (H)"><span data-key-primary>ㅗ</span><span data-key-secondary>H</span></button>
          <button type="button" data-code="KeyJ" aria-label="ㅓ (J)"><span data-key-primary>ㅓ</span><span data-key-secondary>J</span></button>
          <button type="button" data-code="KeyK" aria-label="ㅏ (K)"><span data-key-primary>ㅏ</span><span data-key-secondary>K</span></button>
          <button type="button" data-code="KeyL" aria-label="ㅣ (L)"><span data-key-primary>ㅣ</span><span data-key-secondary>L</span></button>
          <button type="button" class="function-key" data-code="Enter" aria-label="Enter · 글 뽑기"><span aria-hidden="true" class="key-symbol">↵</span><span class="key-name">Enter</span></button>
        </div>
        <div class="key-row">
          <button type="button" class="function-key" data-code="ShiftLeft" aria-label="왼쪽 Shift" aria-pressed="false"><span aria-hidden="true" class="key-symbol">⇧</span><span class="key-name">Shift</span></button>
          <button type="button" data-code="KeyZ" aria-label="ㅋ (Z)"><span data-key-primary>ㅋ</span><span data-key-secondary>Z</span></button>
          <button type="button" data-code="KeyX" aria-label="ㅌ (X)"><span data-key-primary>ㅌ</span><span data-key-secondary>X</span></button>
          <button type="button" data-code="KeyC" aria-label="ㅊ (C)"><span data-key-primary>ㅊ</span><span data-key-secondary>C</span></button>
          <button type="button" data-code="KeyV" aria-label="ㅍ (V)"><span data-key-primary>ㅍ</span><span data-key-secondary>V</span></button>
          <button type="button" data-code="KeyB" aria-label="ㅠ (B)"><span data-key-primary>ㅠ</span><span data-key-secondary>B</span></button>
          <button type="button" data-code="KeyN" aria-label="ㅜ (N)"><span data-key-primary>ㅜ</span><span data-key-secondary>N</span></button>
          <button type="button" data-code="KeyM" aria-label="ㅡ (M)"><span data-key-primary>ㅡ</span><span data-key-secondary>M</span></button>
          <button type="button" class="function-key" data-code="Comma" aria-label="쉼표"><span data-key-primary>,</span></button>
          <button type="button" class="function-key" data-code="Period" aria-label="마침표"><span data-key-primary>.</span></button>
          <button type="button" class="function-key" data-code="ShiftRight" aria-label="오른쪽 Shift" aria-pressed="false"><span aria-hidden="true" class="key-symbol">⇧</span><span class="key-name">Shift</span></button>
        </div>
        <div class="key-row">
          <button type="button" class="function-key" data-code="Lang1" aria-label="한글과 영문 자판 전환" aria-pressed="false"><span class="key-name"><span class="hangul-mode">한</span> / <span class="latin-mode">영</span></span></button>
          <button type="button" class="function-key" data-code="Space" aria-label="띄어쓰기"><span aria-hidden="true" class="key-symbol">␣</span><span class="key-name">Space</span></button>
          <button type="button" class="function-key" data-code="ArrowLeft" aria-label="커서 왼쪽"><span aria-hidden="true" class="key-symbol">←</span></button>
          <button type="button" class="function-key" data-code="ArrowRight" aria-label="커서 오른쪽"><span aria-hidden="true" class="key-symbol">→</span></button>
        </div>
      </div>
      <footer class="writing-tools">
        <div class="draft-info">
          <span id="word-count">0자</span><span id="save-status" role="status"></span>
          <button type="button" class="pieces-button" data-open-pieces>뽑은 글</button>
          <div class="draft-exports">
            <button type="button" data-action="copy" disabled>글 복사</button>
            <button type="button" data-action="download" disabled>TXT 저장</button>
          </div>
        </div>
        <span id="editor-shortcuts"><kbd>Shift + Enter</kbd> 줄바꿈<span class="assist">, Enter로 글 뽑기</span></span>
        <button id="pull" class="print-button" type="button" title="Enter로 글 뽑기" disabled>글 뽑기<svg aria-hidden="true"><use href="#g-enter"/></svg></button>
      </footer>
    </section>

    <section id="receipt-view" hidden aria-labelledby="receipt-focus">
      <article class="receipt-slip" aria-label="출력 내용">
        <header class="receipt-heading"><span class="logotype" aria-hidden="true" lang="en">gul<strong>gam</strong></span><h1 id="receipt-focus" tabindex="-1">글 영수증</h1></header>
        <div class="receipt-meta">
          <div id="receipt-word-1"></div>
          <div id="receipt-word-2"></div>
          <div id="receipt-rule" class="receipt-rule" hidden></div>
          <div id="receipt-conditions" class="receipt-conditions" hidden></div>
          <div class="receipt-timing">걸린 시간 <span id="receipt-elapsed"></span></div>
        </div>
        <div class="receipt-body"><div id="receipt-text"></div><div id="receipt-playback" aria-hidden="true"></div></div>
      </article>
      <p id="receipt-kept" class="receipt-kept"></p>
      <div class="output-controls">
        <button id="back" type="button"><svg aria-hidden="true"><use href="#g-back"/></svg>다시 쓰기</button>
        <button type="button" data-action="share-image">영수증 이미지</button>
        <button type="button" data-action="share-prompt">글감 보내기</button>
        <button id="copy" type="button">글 복사</button>
        <button id="download" type="button">TXT 저장</button>
        <button id="skip-print" type="button" hidden>바로 보기</button>
      </div>
      <textarea id="copy-fallback" readonly hidden aria-label="복사용 본문"></textarea>
    </section>
  </main>
  <dialog id="prompt-dialog" aria-labelledby="prompt-title">
    <div class="dialog-heading"><h2 id="prompt-title">글감 설정</h2><button data-close-dialog aria-label="글감 설정 닫기" type="button" class="icon"><svg><use href="#close-icon"/></svg></button></div>
    <div class="setting-row"><label for="prompt-kind">글감 <small>형용사는 모양을 바꿔 써도 돼요</small></label><select id="prompt-kind" data-prompt-kind><option value="noun">명사 + 명사</option><option value="adjective">형용사 + 명사</option></select></div>
    <div class="setting-row"><label for="prompt-rule">제약 <small>앱이 확인하고 글 뽑기를 막아요</small></label><select id="prompt-rule" data-prompt-rule><option value="">없음</option></select></div>
    <div class="prompt-value" data-prompt-value hidden><span data-rule-value></span><button type="button" data-redraw-rule>다른 값 뽑기</button></div>
    <div class="setting-row"><label for="prompt-pov">시점</label><select id="prompt-pov" data-prompt-condition="pov"><option value="">없음</option></select></div>
    <div class="setting-row"><label for="prompt-mood">분위기</label><select id="prompt-mood" data-prompt-condition="mood"><option value="">없음</option></select></div>
    <div class="setting-row"><label for="prompt-form">묘사 방식</label><select id="prompt-form" data-prompt-condition="form"><option value="">없음</option></select></div>
    <p class="prompt-note">시점·분위기·묘사 방식은 영수증에 적히기만 해요. 지켰는지는 읽는 사람이 봐요.</p>
  </dialog>
  <dialog id="pieces-dialog" aria-labelledby="pieces-title">
    <div class="dialog-heading"><h2 id="pieces-title">뽑은 글</h2><button data-close-dialog aria-label="뽑은 글 닫기" type="button" class="icon"><svg><use href="#close-icon"/></svg></button></div>
    <p class="pieces-note">이 브라우저에만 남아요. 브라우저 데이터를 지우면 사라져요.</p>
    <ul id="pieces-list" class="pieces-list"></ul>
    <p id="pieces-empty" class="pieces-empty" hidden>아직 뽑은 글이 없어요. 글을 뽑으면 여기에 쌓여요.</p>
    <div class="pieces-footer"><span id="pieces-count"></span><button type="button" data-export-pieces disabled>전부 TXT로 저장</button></div>
  </dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
