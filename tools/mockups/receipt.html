<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 C · 편의점 영수증</title>
<style>
@font-face { font-family: "Noto Sans KR"; src: url("/dist/assets/noto-kr.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: Poppins; src: url("/dist/assets/poppins-500.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: Poppins; src: url("/dist/assets/poppins-700.woff2") format("woff2"); font-weight: 700; }
:root { --counter: #151515; --paper: #fdfcf8; --ink: #1a1a1a; --muted: #6f6b64; --dash: #c6c1b7; --accent: #ff5224; --sans: "Noto Sans KR", sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { min-height: 100svh; display: flex; flex-direction: column; font: 500 14px/1.5 var(--sans); color: #eee; background: var(--counter); }
header { display: flex; justify-content: space-between; align-items: center; padding: 18px 22px 0; }
.logo { font: 500 19px/1 Poppins, var(--sans); letter-spacing: -.6px; }
.logo b { font-weight: 700; }
.open { font-size: 12px; color: var(--accent); letter-spacing: .04em; }
main { flex: 1; width: min(100% - 40px, 420px); margin: 0 auto; padding: clamp(20px, 5svh, 44px) 0 0; }
.paper {
  --teeth: conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) 50% / 16px 100%;
  padding: 30px 26px 26px; color: var(--ink); background: var(--paper);
  background-image: repeating-linear-gradient(0deg, rgba(0, 0, 0, .025) 0 1px, transparent 1px 3px);
  -webkit-mask: var(--teeth); mask: var(--teeth);
  filter: drop-shadow(0 8px 14px rgba(0, 0, 0, .35));
}
.shop { text-align: center; }
.shop .name { font: 700 15px/1.3 var(--sans); letter-spacing: .12em; }
.shop .meta { margin-top: 2px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dash { border: 0; border-top: 2px dashed var(--dash); margin: 14px 0; }
.items { font-size: 15px; }
.items div { display: flex; justify-content: space-between; padding: 3px 0; }
.items .tick { color: var(--muted); }
.items .tick::after { content: "✓"; font-weight: 700; margin-left: 6px; color: var(--ink); }
.items .label { font-size: 11px; color: var(--muted); margin-top: 4px; }
textarea { display: block; width: 100%; min-height: 36svh; border: 0; padding: 0; resize: none; outline: none; background: transparent; font: 400 16px/1.75 var(--sans); color: var(--ink); }
.total { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.total b { color: var(--ink); font-weight: 600; }
.barcode { height: 34px; margin-top: 14px; background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px, var(--ink) 8px 11px, transparent 11px 13px); }
.site { margin-top: 6px; text-align: center; font: 500 11px/1 Poppins, var(--sans); letter-spacing: .08em; color: var(--muted); }
footer { width: min(100% - 40px, 420px); margin: 0 auto; padding: 18px 0 24px; }
.finish { width: 100%; border: 0; border-radius: 8px; padding: 15px; font: inherit; font-size: 15px; font-weight: 700; color: var(--accent); background: #000; letter-spacing: .02em; cursor: pointer; }
.finish small { display: block; margin-top: 2px; font-size: 11px; font-weight: 500; color: #888; }
@media (max-width: 650px) { main, footer { width: calc(100% - 28px); } .paper { padding: 26px 20px 22px; } }
</style>
</head>
<body>
<header><span class="logo">gul<b>gam</b></span><span class="open">24시간 영업 중</span></header>
<main>
  <article class="paper">
    <div class="shop"><div class="name">글감 편의점</div><div class="meta">오늘의 글감 1번 · 2026.11.23 09:12 · 계산대 1</div></div>
    <hr class="dash">
    <div class="items">
      <div><span>생일</span><span class="tick">1개</span></div>
      <div><span>마당</span><span class="tick">1개</span></div>
      <div class="label">두 단어를 모두 담으면 계산할 수 있어요</div>
    </div>
    <hr class="dash">
    <textarea aria-label="나의 글" spellcheck="false">생일 아침, 마당에 나가 보니 아무도 없었다. 케이크 대신 빨랫줄에 걸린 이불이 바람에 부풀었다. 나는 그 앞에서 혼자 박수를 쳤다.

오후에는 동생이 돌아와 마당의 흙에 내 이름을 썼다. 비가 오기 전까지 그 이름은 거기 있었다.</textarea>
    <hr class="dash">
    <div class="total"><span>소계 <b class="count">129자</b></span><span>걸린 시간 <b>0:42</b></span></div>
    <div class="barcode" aria-hidden="true"></div>
    <div class="site">gulgam.dokhustudio.com</div>
  </article>
</main>
<footer><button class="finish" type="button">글 뽑기<small>Enter</small></button></footer>
<script>
(() => {
  const field = document.querySelector('textarea');
  const count = document.querySelector('.count');
  field.addEventListener('input', () => { count.textContent = Array.from(field.value).length + '자'; });
})();
</script>
</body>
</html>
