<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 A2 · 눈밭, 기존 골자 그대로</title>

<style>
/* The layout is the live basic mode. Only the writing surface changes: it is a
   field of snow, every letter is pressed into it, and each press makes a sound. */
:root {
  --field: light-dark(#f5f7fa, #121c2e);
  --field-edge: light-dark(#e6ebf2, #0c1424);
  --snow-ink: light-dark(#233047, #e8eef8);
  --press-light: light-dark(rgba(255, 255, 255, .95), rgba(0, 0, 0, 0));
  --press-dark: light-dark(rgba(35, 48, 71, .28), rgba(255, 255, 255, .22));
  --lift: light-dark(rgba(35, 48, 71, .35), rgba(0, 0, 0, .5));
  --dip: light-dark(rgba(35, 48, 71, .34), rgba(255, 255, 255, .26));
  --spray: light-dark(#fff, #dfe7f3);
}
.writing-area {
  position: relative; border-top: 0; padding: 18px 26px 12px; margin-inline: -26px; border-radius: 6px;
  background: radial-gradient(120% 80% at 50% 0%, var(--field), var(--field-edge));
  box-shadow: inset 0 1px 0 light-dark(#fff, rgba(255, 255, 255, .05)), 0 1px 2px light-dark(rgba(35, 48, 71, .06), transparent);
}
.writing-area::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: url("/dist/assets/grain.png"); opacity: .13; mix-blend-mode: multiply;
}
:root[data-theme="dark"] .writing-area::before { mix-blend-mode: screen; opacity: .07; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .writing-area::before { mix-blend-mode: screen; opacity: .07; } }
#words { color: light-dark(#6f7c95, #8f9fbb); }
[data-prompt-word][data-used="true"]::after { visibility: visible; }
#editor { color: transparent; -webkit-text-fill-color: transparent; caret-color: var(--snow-ink); position: relative; z-index: 2; }
#editor::placeholder { -webkit-text-fill-color: light-dark(#8d97a8, #6f7d95); }
.snow-layer, .snow-fx { position: absolute; left: 26px; right: 26px; pointer-events: none; overflow: hidden; }
.snow-layer {
  z-index: 1; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--snow-ink);
  font: 400 23px/var(--writing-line-height) var(--text-font); letter-spacing: -.35px;
}
.snow-fx { z-index: 3; }
.g { position: relative; text-shadow: 0 1px 0 var(--press-light), 0 -1px 1px var(--press-dark); }
.g.land { animation: land .26s cubic-bezier(.2, .9, .3, 1) both; }
@keyframes land {
  0% { top: -5px; opacity: .35; text-shadow: 0 6px 10px var(--lift); }
  45% { top: 1px; opacity: 1; text-shadow: 0 2px 3px var(--lift); }
  100% { top: 0; text-shadow: 0 1px 0 var(--press-light), 0 -1px 1px var(--press-dark); }
}
.dip {
  position: absolute; border-radius: 50%; transform: translate(-50%, -50%);
  background: radial-gradient(ellipse at 50% 50%, var(--dip), transparent 70%);
  animation: dip .7s ease-out both;
}
@keyframes dip { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.5); } 25% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.25); } }
.spray {
  position: absolute; width: 3px; height: 3px; border-radius: 50%; background: var(--spray);
  box-shadow: 0 0 0 .5px light-dark(rgba(35, 48, 71, .25), transparent);
  animation: spray .42s cubic-bezier(.2, .6, .4, 1) both;
}
@keyframes spray { 0% { opacity: 0; transform: translate(0, 0) scale(.6); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1); } }
@media (prefers-reduced-motion: reduce) { .g.land, .dip, .spray { animation: none; } }
.note { margin: 0 0 18px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body data-view="write" data-edition="original">
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="vol" viewBox="0 0 24 24"><path d="m11.8 4-6 4.8H2.5v6.4h3.3l6 4.8Z" fill="currentColor" stroke="none"/><path d="M15.1 8.5a4.6 4.6 0 0 1 0 7m3-10a8.8 8.8 0 0 1 0 13"/></symbol>
    <symbol id="quiet" viewBox="0 0 24 24"><path d="m11.8 4-6 4.8H2.5v6.4h3.3l6 4.8Z" fill="currentColor" stroke="none"/><path d="m15.5 9 6 6m0-6-6 6"/></symbol>
    <symbol id="gear" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" fill-rule="evenodd" d="M10 1h4l.7 3 1.7.8L19 3.3l2.7 2.8-1.5 2.6.8 1.7 3 .7v3.6l-3 .7-.8 1.7 1.5 2.6-2.8 2.7-2.6-1.5-1.7.8-.7 2.7h-3.8l-.7-2.7-1.7-.8-2.6 1.5-2.8-2.7 1.5-2.6-.8-1.7-2.7-.7v-3.6l2.7-.7.8-1.7L2.1 6.1l2.8-2.8 2.6 1.5 1.7-.8L10 1Zm2 7.5a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6Z"/></symbol>
    <symbol id="reset" viewBox="0 0 24 24"><path d="M8 6.5A7.5 7.5 0 1 1 5 13M9.3 2.8 6 6.5l3.9 2.8"/></symbol>
    <symbol id="next" viewBox="0 0 24 24"><path d="m9.2 5.4 6.5 6.6-6.5 6.6"/></symbol>
    <symbol id="copy-icon" viewBox="0 0 24 24"><path d="M8.5 7.5h12v14h-12zM16 3H4v14"/></symbol>

    <symbol id="print-icon" viewBox="0 0 24 24"><path d="M7 8V2.8h10V8M7 16H3.5V8h17v8H17M7 13h10v8H7zM16.5 10.5h1"/></symbol>
    <symbol id="dots" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><circle cx="4.5" cy="12" r="2.1"/><circle cx="12" cy="12" r="2.1"/><circle cx="19.5" cy="12" r="2.1"/></g></symbol>
    <symbol id="tone" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path fill="currentColor" stroke="none" d="M12 3a9 9 0 0 1 0 18z"/></symbol>
    <symbol id="share-icon" viewBox="0 0 24 24"><path d="M12 3v12m-4.5-7.5L12 3l4.5 4.5M5 13v7.5h14V13"/></symbol>
    <symbol id="rule-icon" viewBox="0 0 24 24"><path d="M4 6.5h9m5 0h2M4 12h3m5 0h8M4 17.5h11m5 0h0"/><circle cx="15.5" cy="6.5" r="2"/><circle cx="9.5" cy="12" r="2"/><circle cx="17.5" cy="17.5" r="2"/></symbol>
  </svg>
  <header class="topnav column">
    <a class="logotype" href="./" aria-label="GULGAM 글쓰기 홈" lang="en">gul<strong>gam</strong></a>
    <nav class="nav-links" aria-label="주 메뉴">
      <button type="button" id="sound" aria-label="뽀드득 소리" title="뽀드득 소리" aria-pressed="true" class="icon sound-toggle"><svg class="sound-on"><use href="#vol"/></svg><svg class="sound-off"><use href="#quiet"/></svg></button>
      <button type="button" class="nav-reroll">글감 뽑기</button>
      <a href="#" class="edition-link">타자기 버전</a>
      <button type="button" class="nav-settings">설정</button>
      <button class="icon mode-button" type="button" data-theme-toggle aria-label="화면 테마 전환" title="화면 테마 전환"><svg><use href="#tone"/></svg></button>
    </nav>
  </header>
  <main class="column workspace">
    <div class="context-bar">
      <button type="button">뽑은 글</button>
      <button type="button">글감 설정 <svg><use href="#rule-icon"/></svg></button>
      <button type="button">글쓰기 설정 <svg><use href="#gear"/></svg></button>
      <a href="#">타자기 버전 <span class="play-arrow" aria-hidden="true"></span></a>
    </div>
    <section id="write-view" aria-label="글쓰기">
      <div class="writing-area">
        <h1 id="words"><span data-prompt-word>생일</span> · <span data-prompt-word>마당</span></h1>
        <textarea id="editor" spellcheck="false" aria-label="나의 글" placeholder="두 단어를 넣어 자유롭게 써보세요.">생일 아침, 마당에 나가 보니 아무도 없었다. 케이크 대신 빨랫줄에 걸린 이불이 바람에 부풀었다. 나는 그 앞에서 혼자 박수를 쳤다.

오후에는 동생이 돌아와 마당의 흙에 내 이름을 썼다. 비가 오기 전까지 그 이름은 거기 있었다.</textarea>
      </div>
      <div class="finish-row"><button type="button" class="finish-button" data-finish data-ready="true">글 뽑기</button></div>
      <footer class="article-tools">
        <div class="pager">
          <button type="button" aria-label="글감 다시 뽑기" title="글감 다시 뽑기"><svg><use href="#reset"/></svg></button>
          <button type="button" aria-label="글 뽑기" title="글 뽑기"><svg><use href="#next"/></svg></button>
        </div>
        <div class="attribution">
          <strong>오늘의 글감 1번</strong>
          <div><span id="word-count">129자</span><i aria-hidden="true"></i><span>이 브라우저에 임시 저장됨</span></div>
        </div>
        <div class="tool-icons">
          <button type="button" class="icon" aria-label="같은 글감 보내기"><svg><use href="#share-icon"/></svg></button>
          <button type="button" class="icon" aria-label="글 복사"><svg><use href="#copy-icon"/></svg></button>
          <button type="button" class="icon" aria-label="TXT 저장"><svg><use href="#download-icon"/></svg></button>
          <button type="button" class="icon" aria-label="글 뽑기"><svg><use href="#print-icon"/></svg></button>
          <button type="button" class="icon" aria-label="글 도구 더 보기"><svg><use href="#dots"/></svg></button>
        </div>
      </footer>
    </section>
  </main>
<script>
(() => {
  const editor = document.getElementById('editor');
  const area = document.querySelector('.writing-area');
  const layer = document.createElement('div');
  layer.className = 'snow-layer';
  layer.setAttribute('aria-hidden', 'true');
  const fx = document.createElement('div');
  fx.className = 'snow-fx';
  fx.setAttribute('aria-hidden', 'true');
  area.append(layer, fx);

  // The layer sits exactly over the textarea and scrolls with it, so its
  // glyphs land where the real ones are.
  function fit() {
    for (const box of [layer, fx]) {
      box.style.top = editor.offsetTop + 'px';
      box.style.width = editor.clientWidth + 'px';
      box.style.height = editor.clientHeight + 'px';
    }
    layer.scrollTop = editor.scrollTop;
  }
  new ResizeObserver(fit).observe(editor);
  editor.addEventListener('scroll', () => { layer.scrollTop = editor.scrollTop; });

  let shown = '';
  function render(animateFrom = -1, animateTo = -1) {
    const glyphs = Array.from(editor.value);
    const fragment = document.createDocumentFragment();
    const landed = [];
    glyphs.forEach((glyph, index) => {
      const span = document.createElement('span');
      span.className = 'g';
      span.textContent = glyph;
      if (index >= animateFrom && index < animateTo && glyph.trim()) {
        span.classList.add('land');
        landed.push(span);
      }
      fragment.append(span);
    });
    layer.replaceChildren(fragment);
    layer.scrollTop = editor.scrollTop;
    const areaRect = area.getBoundingClientRect();
    for (const span of landed) press(span, areaRect);
    shown = editor.value;
    document.getElementById('word-count').textContent = glyphs.length + '자';
    for (const word of document.querySelectorAll('[data-prompt-word]')) word.dataset.used = String(editor.value.includes(word.textContent));
  }

  // A dip under the glyph and a little spray of snow from its foot.
  function press(span, areaRect) {
    const rect = span.getBoundingClientRect();
    const x = rect.left - areaRect.left + rect.width / 2 - 26;
    const y = rect.top - areaRect.top + rect.height * .58;
    const dip = document.createElement('i');
    dip.className = 'dip';
    dip.style.cssText = `left:${x}px;top:${y - editor.offsetTop}px;width:${rect.width + 16}px;height:${rect.height * .9}px`;
    const made = [dip];
    for (let i = 0; i < 3; i++) {
      const dot = document.createElement('i');
      dot.className = 'spray';
      const dx = (Math.random() - .5) * 18;
      dot.style.cssText = `left:${x + (Math.random() - .5) * rect.width}px;top:${y - editor.offsetTop + 6}px;--dx:${dx}px;--dy:${4 + Math.random() * 9}px;animation-delay:${i * 25}ms`;
      made.push(dot);
    }
    fx.append(...made);
    // A hidden tab pauses animations, so a timer cleans up rather than animationend.
    setTimeout(() => { for (const node of made) node.remove(); }, 900);
  }

  // Only the changed stretch lands: common prefix and suffix stay as they are.
  function changedRange(before, after) {
    const a = Array.from(before), b = Array.from(after);
    let start = 0;
    while (start < a.length && start < b.length && a[start] === b[start]) start++;
    let endA = a.length, endB = b.length;
    while (endA > start && endB > start && a[endA - 1] === b[endB - 1]) { endA--; endB--; }
    return [start, endB];
  }

  // 뽀드득: a crackle of filtered noise, a softer body under it, and a faint thump.
  let audio, noise;
  const master = { gain: .55 };
  function ensureAudio() {
    if (!soundOn()) return false;
    if (!audio) {
      audio = new (window.AudioContext || window.webkitAudioContext)();
      noise = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
      const data = noise.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    }
    if (audio.state === 'suspended') audio.resume().catch(() => null);
    return true;
  }
  function hiss(at, type, frequency, q, length, strength) {
    const source = audio.createBufferSource();
    source.buffer = noise;
    const filter = audio.createBiquadFilter();
    filter.type = type; filter.frequency.value = frequency; filter.Q.value = q;
    const gain = audio.createGain();
    gain.gain.setValueAtTime(.0001, at);
    gain.gain.exponentialRampToValueAtTime(strength * master.gain, at + .004);
    gain.gain.exponentialRampToValueAtTime(.0001, at + length);
    source.connect(filter).connect(gain).connect(audio.destination);
    source.start(at, Math.random() * .6, length + .02);
  }
  function thump(at, strength) {
    const osc = audio.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(130, at);
    osc.frequency.exponentialRampToValueAtTime(60, at + .06);
    const gain = audio.createGain();
    gain.gain.setValueAtTime(.0001, at);
    gain.gain.exponentialRampToValueAtTime(strength * master.gain, at + .003);
    gain.gain.exponentialRampToValueAtTime(.0001, at + .07);
    osc.connect(gain).connect(audio.destination);
    osc.start(at); osc.stop(at + .08);
  }
  function crunch(kind) {
    if (!ensureAudio()) return;
    const at = audio.currentTime + .003;
    const vary = .85 + Math.random() * .3;
    if (kind === 'delete') { hiss(at, 'highpass', 4200, .7, .05, .22 * vary); return; }
    if (kind === 'return') { crunchStep(at, 1.1); crunchStep(at + .11, .9); return; }
    crunchStep(at, kind === 'space' ? 1.25 : vary, kind === 'space');
  }
  function crunchStep(at, weight, heavy) {
    hiss(at, 'bandpass', (heavy ? 1900 : 3100) * (.9 + Math.random() * .2), .9, heavy ? .12 : .075, .5 * weight);
    hiss(at + .006, 'lowpass', 650, .6, heavy ? .1 : .06, .3 * weight);
    thump(at, .14 * weight);
  }

  const soundButton = document.getElementById('sound');
  const soundOn = () => soundButton.getAttribute('aria-pressed') === 'true';
  soundButton.addEventListener('click', () => {
    soundButton.setAttribute('aria-pressed', String(!soundOn()));
    if (soundOn()) crunch('key');
  });

  editor.addEventListener('input', event => {
    const [from, to] = changedRange(shown, editor.value);
    const type = event.inputType || '';
    if (type.startsWith('delete')) crunch('delete');
    else if (type === 'insertLineBreak' || type === 'insertParagraph') crunch('return');
    else if (event.data === ' ') crunch('space');
    else if (to > from) crunch('key');
    render(from, to);
  });

  document.querySelector('[data-theme-toggle]').addEventListener('click', () => {
    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    const current = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
    document.documentElement.dataset.theme = current === 'dark' ? 'light' : 'dark';
  });

  fit();
  render();
  editor.focus();
  editor.setSelectionRange(editor.value.length, editor.value.length);
})();
</script>
</body>
</html>
