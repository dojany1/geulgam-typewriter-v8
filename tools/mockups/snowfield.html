<style>
/* The live basic-mode layout on a field of fresh snow. A letter is a footprint:
   it does not arrive, the surface gives. Nothing moves or spreads; the glyph
   sinks where it is, its walls fall into shadow, its floor stays lit, and a
   rim of pushed-up snow brightens around it. Deleting fills the print back in. */
:root[data-theme="light"] { --bg: #f8fafc; --fg: #243247; --muted: #7383a0; --line: #d3dbe6; --accent: #ff5224; }
:root { --sky: #e4ebf3; --snow: #f9fbfd; --wall: #22304a; --floor: #6c82a4; --rim: rgba(255, 255, 255, .98); --shade: rgba(34, 48, 74, .34); }
body {
  background:
    radial-gradient(55% 32% at 18% 46%, rgba(255, 255, 255, .85), transparent 70%),
    radial-gradient(46% 30% at 72% 68%, rgba(221, 229, 239, .7), transparent 70%),
    radial-gradient(40% 26% at 50% 90%, rgba(255, 255, 255, .7), transparent 70%),
    linear-gradient(var(--sky), var(--snow) 42%);
  background-attachment: fixed;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: url("/dist/assets/grain.png"); opacity: .15; mix-blend-mode: multiply;
}
.topnav, .workspace { position: relative; z-index: 1; }
.writing-area { position: relative; border-top-color: #cfd8e3; }
#words { color: var(--muted); }
[data-prompt-word][data-used="true"]::after { visibility: visible; }
#editor { color: transparent; -webkit-text-fill-color: transparent; caret-color: var(--wall); position: relative; z-index: 2; }
#editor::placeholder { -webkit-text-fill-color: #9aa7bb; }
.snow-layer, .snow-fx { position: absolute; left: 0; right: 0; pointer-events: none; overflow: hidden; }
.snow-layer, .snow-fx { font: 400 23px/var(--writing-line-height) var(--text-font); letter-spacing: -.35px; white-space: pre-wrap; overflow-wrap: anywhere; }
.snow-layer { z-index: 1; }
.snow-fx { z-index: 3; }
/* A print: shadowed wall at the top, lit floor at the bottom, bright rim of pushed snow below. */
.g, .ghost {
  color: transparent; -webkit-text-fill-color: transparent;
  background: linear-gradient(var(--wall) 18%, var(--floor) 92%);
  -webkit-background-clip: text; background-clip: text;
  filter: drop-shadow(0 1px 0 var(--rim)) drop-shadow(0 -1px 1px var(--shade));
}
.g.land { animation: sink .17s ease-out both; }
@keyframes sink {
  0% { opacity: .18; filter: drop-shadow(0 0 0 rgba(255, 255, 255, 0)) drop-shadow(0 0 0 rgba(34, 48, 74, 0)); }
  30% { opacity: .5; filter: drop-shadow(0 .5px 0 rgba(255, 255, 255, .5)) drop-shadow(0 -.5px .5px rgba(34, 48, 74, .15)); }
  100% { opacity: 1; filter: drop-shadow(0 1px 0 var(--rim)) drop-shadow(0 -1px 1px var(--shade)); }
}
/* A deleted print fills back in with snow. */
.ghost { position: absolute; white-space: pre; animation: fill .22s ease-in both; }
@keyframes fill { to { opacity: 0; filter: drop-shadow(0 0 0 rgba(255, 255, 255, 0)) drop-shadow(0 0 0 rgba(34, 48, 74, 0)); } }
@media (prefers-reduced-motion: reduce) { .g.land { animation: none; } .ghost { display: none; } }
</style>
</head>
<body data-view="write" data-edition="original">
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">

    <symbol id="reset" viewBox="0 0 24 24"><path d="M8 6.5A7.5 7.5 0 1 1 5 13M9.3 2.8 6 6.5l3.9 2.8"/></symbol>
    <symbol id="next" viewBox="0 0 24 24"><path d="m9.2 5.4 6.5 6.6-6.5 6.6"/></symbol>
    <symbol id="copy-icon" viewBox="0 0 24 24"><path d="M8.5 7.5h12v14h-12zM16 3H4v14"/></symbol>
    <symbol id="download-icon" viewBox="0 0 24 24"><path d="M12 2.5v12.8m-5-5 5 5 5-5M3.5 17v4.3h17V17"/></symbol>

    <symbol id="dots" viewBox="0 0 24 24"><g fill="currentColor" stroke="none"><circle cx="4.5" cy="12" r="2.1"/><circle cx="12" cy="12" r="2.1"/><circle cx="19.5" cy="12" r="2.1"/></g></symbol>

  </svg>
  <header class="topnav column">
    <a class="logotype" href="./" aria-label="GULGAM 글쓰기 홈" lang="en">gul<strong>gam</strong></a>
    <nav class="nav-links" aria-label="주 메뉴">

  <main class="column workspace">
    <div class="context-bar">
      <button type="button">뽑은 글</button>

    </div>
    <section id="write-view" aria-label="글쓰기">
      <div class="writing-area">
        <h1 id="words"><span data-prompt-word>생일</span> · <span data-prompt-word>마당</span></h1>
        <textarea id="editor" spellcheck="false" aria-label="나의 글" placeholder="두 단어를 넣어 자유롭게 써보세요.">생일 아침, 마당에 나가 보니 아무도 없었다. 케이크 대신 빨랫줄에 걸린 이불이 바람에 부풀었다. 나는 그 앞에서 혼자 박수를 쳤다.

오후에는 동생이 돌아와 마당의 흙에 내 이름을 썼다. 비가 오기 전까지 그 이름은 거기 있었다.</textarea>
      </div>
      <div class="finish-row"><button type="button" class="finish-button" data-finish data-ready="true">글 뽑기</button></div>
      <footer class="article-tools">
        <div class="pager">
          <button type="button" aria-label="글감 다시 뽑기" title="글감 다시 뽑기"><svg><use href="#reset"/></svg></button>
          <button type="button" aria-label="글 뽑기" title="글 뽑기"><svg><use href="#next"/></svg></button>
        </div>
        <div class="attribution">
          <strong>오늘의 글감 1번</strong>
          <div><span id="word-count">129자</span><i aria-hidden="true"></i><span>이 브라우저에 임시 저장됨</span></div>
        </div>
        <div class="tool-icons">
          <button type="button" class="icon" aria-label="같은 글감 보내기"><svg><use href="#share-icon"/></svg></button>
          <button type="button" class="icon" aria-label="글 복사"><svg><use href="#copy-icon"/></svg></button>
          <button type="button" class="icon" aria-label="TXT 저장"><svg><use href="#download-icon"/></svg></button>
          <button type="button" class="icon" aria-label="글 뽑기"><svg><use href="#print-icon"/></svg></button>
          <button type="button" class="icon" aria-label="글 도구 더 보기"><svg><use href="#dots"/></svg></button>
        </div>
      </footer>
    </section>
  </main>
<script>
(() => {
  const editor = document.getElementById('editor');
  const area = document.querySelector('.writing-area');
  const layer = document.createElement('div');
  layer.className = 'snow-layer';
  layer.setAttribute('aria-hidden', 'true');
  const fx = document.createElement('div');
  fx.className = 'snow-fx';
  fx.setAttribute('aria-hidden', 'true');
  area.append(layer, fx);

  // The layer sits exactly over the textarea and scrolls with it, so its
  // glyphs land where the real ones are.
  function fit() {
    for (const box of [layer, fx]) {
      box.style.top = editor.offsetTop + 'px';
      box.style.width = editor.clientWidth + 'px';
      box.style.height = editor.clientHeight + 'px';
    }
    layer.scrollTop = editor.scrollTop;
  }
  new ResizeObserver(fit).observe(editor);
  editor.addEventListener('scroll', () => { layer.scrollTop = editor.scrollTop; });

  let shown = '';
  function render(sinkFrom = -1, sinkTo = -1) {
    const glyphs = Array.from(editor.value);
    const fragment = document.createDocumentFragment();
    glyphs.forEach((glyph, index) => {
      const span = document.createElement('span');
      span.className = 'g';
      span.textContent = glyph;
      if (index >= sinkFrom && index < sinkTo && glyph.trim()) span.classList.add('land');
      fragment.append(span);
    });
    layer.replaceChildren(fragment);
    layer.scrollTop = editor.scrollTop;
    shown = editor.value;
    document.getElementById('word-count').textContent = glyphs.length + '자';
    for (const word of document.querySelectorAll('[data-prompt-word]')) word.dataset.used = String(editor.value.includes(word.textContent));
  }

  // Prints that are deleted fill back in where they were.
  function fillIn(from, to) {
    const spans = Array.from(layer.children).slice(from, to);
    const layerRect = layer.getBoundingClientRect();
    for (const span of spans) {
      if (!span.textContent.trim()) continue;
      const rect = span.getBoundingClientRect();
      const ghost = document.createElement('span');
      ghost.className = 'ghost';
      ghost.textContent = span.textContent;
      ghost.style.left = rect.left - layerRect.left + 'px';
      ghost.style.top = rect.top - layerRect.top + 'px';
      fx.append(ghost);
      // A hidden tab pauses animations, so a timer cleans up rather than animationend.
      setTimeout(() => ghost.remove(), 350);
    }
  }

  // Only the changed stretch sinks: common prefix and suffix stay as they are.
  function changedRange(before, after) {
    const a = Array.from(before), b = Array.from(after);
    let start = 0;
    while (start < a.length && start < b.length && a[start] === b[start]) start++;
    let endA = a.length, endB = b.length;
    while (endA > start && endB > start && a[endA - 1] === b[endB - 1]) { endA--; endB--; }
    return [start, endA, endB];
  }

  editor.addEventListener('input', () => {
    const [start, oldEnd, newEnd] = changedRange(shown, editor.value);
    if (oldEnd > start) fillIn(start, oldEnd);
    render(start, newEnd);
  });

  fit();
  render();
  editor.focus();
  editor.setSelectionRange(editor.value.length, editor.value.length);
})();
</script>
</body>
</html>
